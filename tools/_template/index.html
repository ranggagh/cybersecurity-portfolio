<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="TOOL_NAME - Deskripsi singkat tool.">
  <title>TOOL_NAME | Rangga Ganupranowo Hadad</title>
  <!-- Wajib login: sembunyikan halaman sampai sesi Supabase terkonfirmasi -->
  <script src="../../js/shared/auth-guard.js"></script>
  <link rel="stylesheet" href="../../css/base.css">
  <link rel="stylesheet" href="tool.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Background Network Canvas -->
  <canvas id="cyber-canvas" class="cyber-canvas" aria-hidden="true"></canvas>

  <!-- App Header & Navigation -->
  <header class="site-header">
    <nav class="nav-container">
      <a href="../../index.html" class="brand-logo" aria-label="Home">
        <span class="logo-prefix">&gt;</span>
        <span class="logo-name">RGH</span>
        <span class="logo-badge">TOOL::TAG</span>
      </a>

      <div class="app-nav-actions" style="display: flex; align-items: center; gap: 1rem;">
        <div id="nav-auth-container" class="nav-auth-container"></div>
        <a href="../../index.html#projects" class="btn btn-outline btn-sm">
          <span>← Back to Portfolio</span>
        </a>
      </div>
    </nav>
  </header>

  <main class="app-page-main">
    <div class="container">
      <!-- Breadcrumb & Status -->
      <div class="app-header-bar">
        <div class="breadcrumb">
          <a href="../../index.html">Portfolio</a>
          <span class="sep">/</span>
          <a href="../../index.html#projects">Projects</a>
          <span class="sep">/</span>
          <span class="current">TOOL_NAME</span>
        </div>

        <div class="status-indicator">
          <span class="status-dot"></span>
          <span class="status-text">STATUS // READY</span>
        </div>
      </div>

      <!-- Application Hero Header -->
      <div class="app-title-section">
        <h1 class="section-title">TOOL_NAME</h1>
        <p class="lead-text">
          Deskripsi singkat tentang apa yang dilakukan tool ini.
        </p>
      </div>

      <!-- Application Workspace -->
      <section class="app-workspace cyber-card">
        <div class="terminal-bar">
          <div class="terminal-buttons">
            <span class="term-btn term-close"></span>
            <span class="term-btn term-min"></span>
            <span class="term-btn term-max"></span>
          </div>
          <div class="terminal-title">node: /opt/tool-slug</div>
          <div class="terminal-status">READY</div>
        </div>

        <!-- Isi tool dirender di sini (lihat tool.js) -->
        <div id="tool-root" class="app-container-body tool-root"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <div class="footer-left">
        <span class="footer-name">Rangga Ganupranowo Hadad</span>
        <span class="footer-divider">|</span>
        <span class="footer-tagline">Cybersecurity &amp; Network Defense</span>
      </div>
      <div class="footer-right">
        <a href="../../index.html#projects" class="back-to-top">Portfolio Projects ↑</a>
      </div>
    </div>
  </footer>

  <script src="../../js/shared/script.js"></script>

  <!-- Supabase JS Client & Centralized Auth -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../../js/shared/supabase-config.js"></script>
  <script src="../../js/shared/supabase-client.js"></script>
  <script src="../../js/shared/auth.js"></script>

  <!-- Logika khusus tool ini (ES module: bisa import dari ./engine/) -->
  <script type="module" src="tool.js"></script>
</body>
</html>
